<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="#2c3e50" stroke="#ecf0f1" stroke-width="5"/>
  <!-- Antenna mast -->
  <line x1="100" y1="150" x2="100" y2="78" stroke="#ecf0f1" stroke-width="7" stroke-linecap="round"/>
  <circle cx="100" cy="70" r="9" fill="#e67e22"/>
  <!-- Radiating arcs (streaming radiohead) -->
  <path d="M 68 48 A 46 46 0 0 1 132 48" fill="none" stroke="#3498db" stroke-width="7" stroke-linecap="round"/>
  <path d="M 54 30 A 66 66 0 0 1 146 30" fill="none" stroke="#3498db" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
  <!-- Sample stream dots flowing right -->
  <circle cx="118" cy="128" r="6" fill="#e67e22"/>
  <circle cx="136" cy="128" r="6" fill="#e67e22" opacity="0.7"/>
  <circle cx="154" cy="128" r="6" fill="#e67e22" opacity="0.4"/>
  <!-- Baseline -->
  <line x1="55" y1="150" x2="145" y2="150" stroke="#ecf0f1" stroke-width="6" stroke-linecap="round"/>
</svg>
