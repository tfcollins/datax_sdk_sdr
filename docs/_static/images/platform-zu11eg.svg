<svg xmlns="http://www.w3.org/2000/svg" class="adi-figure no-background"
     viewBox="0 0 1100 440" width="100%"
     style="max-width: 1080px; height: auto;">
  <style>
    svg.adi-figure {
      --adi-fill-drv:    #cbd9e8;
      --adi-fill-mcu:    #f4dca0;
      --adi-fill-hw:     #f7c8a4;
      --adi-fill-blank:  #ffffff;
      --adi-box-stroke:  #c9bfa9;
      --adi-new-stroke:  #c07b3a;
      --adi-panel-bg:    #f7f1e6;
      --adi-panel-stroke:#e3dcc9;
      --adi-datax-bg:    #e4ecf6;
      --adi-datax-stroke:#b6c4dc;
      --adi-text-strong: #2b2a26;
      --adi-text-muted:  #6b6660;
      --adi-arrow:       #b3aa97;
      --adi-accent:      #6b8aaa;
    }
    @media (prefers-color-scheme: dark) {
      svg.adi-figure {
        --adi-fill-drv: #243246; --adi-fill-mcu: #4d402a; --adi-fill-hw: #4d3525;
        --adi-fill-blank: #14181e; --adi-box-stroke: #4a5260; --adi-new-stroke: #d99a5b;
        --adi-panel-bg: #1a2028;  --adi-panel-stroke: #3a424b;
        --adi-datax-bg: #1f2a3d;  --adi-datax-stroke: #3a4960;
        --adi-text-strong: #e5e5e5; --adi-text-muted: #aaaaaa;
        --adi-arrow: #6a7484;      --adi-accent: #7da3c4;
      }
    }
    body.dark svg.adi-figure {
      --adi-fill-drv: #243246; --adi-fill-mcu: #4d402a; --adi-fill-hw: #4d3525;
      --adi-fill-blank: #14181e; --adi-box-stroke: #4a5260; --adi-new-stroke: #d99a5b;
      --adi-panel-bg: #1a2028;  --adi-panel-stroke: #3a424b;
      --adi-datax-bg: #1f2a3d;  --adi-datax-stroke: #3a4960;
      --adi-text-strong: #e5e5e5; --adi-text-muted: #aaaaaa;
      --adi-arrow: #6a7484;      --adi-accent: #7da3c4;
    }
    svg.adi-figure .adi-panel { fill: var(--adi-panel-bg); stroke: var(--adi-panel-stroke); stroke-width: 1.25; }
    svg.adi-figure .adi-datax-band { fill: var(--adi-datax-bg); stroke: var(--adi-datax-stroke); stroke-width: 1.25; }
    svg.adi-figure .adi-title { font: 600 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-strong); }
    svg.adi-figure .adi-section-label { font: 600 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); letter-spacing: 0.04em; }
    svg.adi-figure .box { stroke: var(--adi-box-stroke); stroke-width: 1.25; }
    svg.adi-figure .box-new { stroke: var(--adi-new-stroke); stroke-width: 2; }
    svg.adi-figure .box-roadmap { fill: var(--adi-fill-blank); stroke: var(--adi-accent); stroke-width: 1.25; stroke-dasharray: 6 4; }
    svg.adi-figure .box-text { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-strong); }
    svg.adi-figure .box-desc { font: 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); }
    svg.adi-figure .arrow { stroke: var(--adi-arrow); stroke-width: 1.5; fill: none; }
    svg.adi-figure .arrow-new { stroke: var(--adi-new-stroke); stroke-width: 1.5; fill: none; }
    svg.adi-figure .arrowhead-fill { fill: var(--adi-arrow); }
    svg.adi-figure .arrow-label { font: italic 10px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); }
    svg.adi-figure .note-text { font: italic 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--adi-text-muted); }
  </style>

  <defs>
    <marker id="zu-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" class="arrowhead-fill"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1080" height="420" rx="14" class="adi-panel"/>
  <text x="550" y="38" class="adi-title" text-anchor="middle">ADRV9009-ZU11EG — what exists vs what is new</text>

  <!-- legend -->
  <rect x="700" y="52" width="14" height="14" rx="3" class="box" fill="var(--adi-fill-mcu)"/>
  <text x="720" y="63" class="note-text">exists</text>
  <rect x="775" y="52" width="14" height="14" rx="3" class="box-new" fill="var(--adi-fill-mcu)"/>
  <text x="795" y="63" class="note-text">new work</text>
  <rect x="870" y="52" width="14" height="14" rx="3" class="box-roadmap"/>
  <text x="890" y="63" class="note-text">roadmap</text>

  <!-- PS -->
  <text x="150" y="92" class="adi-section-label" text-anchor="middle">ZYNQMP PS</text>
  <rect x="40" y="105" width="220" height="110" rx="8" class="box" fill="var(--adi-fill-drv)"/>
  <text x="150" y="130" class="box-text" text-anchor="middle">Linux (JESD204-FSM)</text>
  <text x="150" y="150" class="box-desc" text-anchor="middle">libiio · iiod · adrv9009 driver</text>
  <text x="150" y="166" class="box-desc" text-anchor="middle">Tick IIO driver (validate P3)</text>
  <text x="150" y="182" class="box-desc" text-anchor="middle">mqnic netdev (mainline-track)</text>

  <!-- fabric band -->
  <text x="595" y="92" class="adi-section-label" text-anchor="middle">FPGA FABRIC (XCZU11EG)</text>
  <rect x="300" y="105" width="590" height="280" rx="8" class="adi-datax-band"/>

  <rect x="320" y="125" width="260" height="90" rx="8" class="box" fill="var(--adi-fill-mcu)"/>
  <text x="450" y="150" class="box-text" text-anchor="middle">JESD204B stream datapath</text>
  <text x="450" y="168" class="box-desc" text-anchor="middle">rx/tx link layer · cpack / upack</text>
  <text x="450" y="184" class="box-desc" text-anchor="middle">data_offload · axi_dmac</text>
  <text x="450" y="200" class="box-desc" text-anchor="middle">stock reference design</text>

  <rect x="610" y="125" width="260" height="90" rx="8" class="box-new" fill="var(--adi-fill-mcu)"/>
  <text x="740" y="150" class="box-text" text-anchor="middle">Tick scheduler + tagger</text>
  <text x="740" y="168" class="box-desc" text-anchor="middle">artifacts exist — validate (P3)</text>
  <text x="740" y="184" class="box-desc" text-anchor="middle">BD 0x4600_0000 → PS 0x8600_0000</text>
  <text x="740" y="200" class="box-desc" text-anchor="middle">FHM GPIO trigger · not on silicon yet</text>

  <rect x="320" y="250" width="260" height="90" rx="8" class="box" fill="var(--adi-fill-mcu)"/>
  <text x="450" y="275" class="box-text" text-anchor="middle">Corundum NIC</text>
  <text x="450" y="293" class="box-desc" text-anchor="middle">upstream — make CORUNDUM=1</text>
  <text x="450" y="309" class="box-desc" text-anchor="middle">QSFP+ 10G · CSR 0xA000_0000</text>
  <text x="450" y="325" class="box-desc" text-anchor="middle">hdl_2026_r1 (see release fork)</text>

  <rect x="610" y="250" width="260" height="90" rx="8" class="box-roadmap"/>
  <text x="740" y="275" class="box-text" text-anchor="middle">VITA-49 packetizer</text>
  <text x="740" y="293" class="box-desc" text-anchor="middle">roadmap (P6) — lead platform</text>
  <text x="740" y="309" class="box-desc" text-anchor="middle">app section → NIC TX queues</text>
  <text x="740" y="325" class="box-desc" text-anchor="middle">QSFP lane headroom beyond 10 G</text>

  <!-- RF -->
  <text x="1000" y="92" class="adi-section-label" text-anchor="middle">RF / CLOCKING</text>
  <rect x="920" y="105" width="160" height="130" rx="8" class="box" fill="var(--adi-fill-hw)"/>
  <text x="1000" y="130" class="box-text" text-anchor="middle">2× ADRV9009</text>
  <text x="1000" y="150" class="box-desc" text-anchor="middle">4R4T · JESD204B</text>
  <text x="1000" y="166" class="box-desc" text-anchor="middle">Talise FHM hop</text>
  <text x="1000" y="188" class="box-text" text-anchor="middle">HMC7044</text>
  <text x="1000" y="206" class="box-desc" text-anchor="middle">SYSREF · MCS</text>

  <!-- arrows -->
  <line x1="260" y1="160" x2="318" y2="160" class="arrow" marker-end="url(#zu-arrow)"/>
  <text x="289" y="148" class="arrow-label" text-anchor="middle">AXI</text>
  <line x1="580" y1="170" x2="608" y2="170" class="arrow-new" marker-end="url(#zu-arrow)"/>
  <text x="594" y="158" class="arrow-label" text-anchor="middle">sync_ext</text>
  <line x1="870" y1="150" x2="918" y2="150" class="arrow-new" marker-end="url(#zu-arrow)"/>
  <text x="894" y="138" class="arrow-label" text-anchor="middle">FHM GPIO</text>
  <line x1="918" y1="185" x2="582" y2="185" class="arrow" marker-end="url(#zu-arrow)"/>
  <text x="894" y="200" class="arrow-label" text-anchor="middle">JESD204B</text>
  <line x1="320" y1="295" x2="262" y2="205" class="arrow" marker-end="url(#zu-arrow)"/>
  <text x="270" y="248" class="arrow-label" text-anchor="middle">QSFP+ 10G</text>

  <text x="550" y="412" class="note-text" text-anchor="middle">Release fork: Tick validated on hdl_2023_r2; Corundum needs hdl_2026_r1 (open cache-coherency regression). Roadmap P3/P5 carry the decision gate.</text>
</svg>
