name: Support matrix nightly

# Advisory: re-renders the support matrix from each repository's branch tip,
# checks that every "validated" row's workflow last passed, and link-checks
# public evidence. Findings go to one tracking issue; nothing here gates a merge.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install datax-support
        run: python -m pip install -e .

      - name: Run the nightly check
        id: nightly
        run: |
          datax-support nightly --sources sources.json --generated docs/_generated --out report.md
          if grep -q '^Clean\.$' report.md; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          SUPPORT_READ_TOKEN: ${{ secrets.SUPPORT_READ_TOKEN }}

      - name: Open or update the tracking issue
        if: steps.nightly.outputs.clean == 'false'
        run: |
          title="support matrix: drift/red"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
                   --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          printf '\n_Run: %s_\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> report.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
          else
            gh label create support-matrix --color 0E8A16 --description "support matrix nightly" 2>/dev/null || true
            gh issue create --title "$title" --body-file report.md --label support-matrix
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Close the tracking issue when clean
        if: steps.nightly.outputs.clean == 'true'
        run: |
          title="support matrix: drift/red"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
                   --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Clean on $(date -u +%Y-%m-%d)."
            gh issue close "$number"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
