name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool:
    name: datax-support tests and fixture checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install datax-support
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Fixture manifests pass the check
        run: |
          for f in tools/tests/fixtures/*.support.json; do
            datax-support check "$f" --repo-root tools/tests/fixtures/repo-ok
          done

  support-render:
    name: generated support fragments are current
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install datax-support
        run: python -m pip install -e .

      - name: Render from the pinned sources
        # Fails loudly when SUPPORT_READ_TOKEN is missing: tick and vrt49 are
        # private, and an empty table must never pass as "current".
        run: datax-support render --sources sources.json --out docs/_generated
        env:
          SUPPORT_READ_TOKEN: ${{ secrets.SUPPORT_READ_TOKEN }}

      - name: Committed fragments match
        run: |
          if ! git diff --exit-code -- docs/_generated; then
            echo "::error::generated fragments are stale: run 'datax-support render --sources sources.json --out docs/_generated' and commit" >&2
            exit 1
          fi
