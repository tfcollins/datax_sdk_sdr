name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool:
    name: datax-support tests and fixture checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install datax-support
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Fixture manifests pass the check
        run: |
          for f in tools/tests/fixtures/*.support.json; do
            datax-support check "$f" --repo-root tools/tests/fixtures/repo-ok
          done
